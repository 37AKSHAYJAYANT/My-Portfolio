  <header class="page-header container">
    <h1>Let's Connect!</h1>
  </header>

  <main class="container">
    <!-- Success/Error Messages -->
    <div id="form-messages" class="form-messages" role="alert" aria-live="polite" aria-atomic="true"></div>

    <form id="contact-form" novalidate>
      <div class="form-group">
        <label for="name">
          Full Name <span class="required" aria-label="required">*</span>
        </label>
        <input type="text" id="name" name="name" required aria-describedby="name-hint name-error" autocomplete="name" />
        <div id="name-hint" class="field-hint">Enter your first and last name</div>
        <div id="name-error" class="error-message" role="alert" aria-live="polite"></div>
      </div>

      <div class="form-group">
        <label for="email">
          Email Address <span class="required" aria-label="required">*</span>
        </label>
        <input type="email" id="email" name="email" required aria-describedby="email-hint email-error"
          autocomplete="email" />
        <div id="email-hint" class="field-hint">I'll use this to respond to your message</div>
        <div id="email-error" class="error-message" role="alert" aria-live="polite"></div>
      </div>

      <input type="hidden" id="from_field" name="from_field" />

      <div class="form-group">
        <label for="phone">
          Phone Number <span class="optional">(optional)</span>
        </label>
        <div class="phone-input-group">
          <select id="country-code" name="country_code" class="country-code-select" aria-label="Country Code">
            <option value="+91" selected>🇮🇳 +91 (IN)</option>
            <option value="+1">🇺🇸 +1 (US)</option>
            <option value="+44">🇬🇧 +44 (UK)</option>
            <option value="+1">🇨🇦 +1 (CA)</option>
            <option value="+61">🇦🇺 +61 (AU)</option>
            <option value="+971">🇦🇪 +971 (AE)</option>
            <option value="+49">🇩🇪 +49 (DE)</option>
            <option value="+33">🇫🇷 +33 (FR)</option>
            <option value="+65">🇸🇬 +65 (SG)</option>
            <option value="+81">🇯🇵 +81 (JP)</option>
            <option value="+86">🇨🇳 +86 (CN)</option>
            <option value="+7">🇷🇺 +7 (RU)</option>
            <option value="+55">🇧🇷 +55 (BR)</option>
            <option value="+27">🇿🇦 +27 (ZA)</option>
            <option value="+966">🇸🇦 +966 (SA)</option>
            <option value="+64">🇳🇿 +64 (NZ)</option>
            <option value="+39">🇮🇹 +39 (IT)</option>
            <option value="+34">🇪🇸 +34 (ES)</option>
            <option value="+82">🇰🇷 +82 (KR)</option>
            <option value="+977">🇳🇵 +977 (NP)</option>
            <option value="+880">🇧🇩 +880 (BD)</option>
            <option value="+94">🇱🇰 +94 (LK)</option>
          </select>
          <input type="tel" id="phone" name="phone" inputmode="numeric" pattern="[0-9]*" maxlength="15"
            aria-describedby="phone-hint phone-error" autocomplete="tel" placeholder="Enter mobile number" />
        </div>
        <div id="phone-hint" class="field-hint">Select country code and enter mobile number</div>
        <div id="phone-error" class="error-message" role="alert" aria-live="polite"></div>
      </div>

      <div class="form-group message-group">
        <label for="message">
          Message <span class="required" aria-label="required">*</span>
        </label>
        <textarea id="message" name="message" required aria-describedby="message-hint message-error"
          placeholder="Give me your best project ideas!"></textarea>
        <div class="message-footer">
          <div id="message-hint" class="field-hint">Drop your message here</div>
        </div>
        <div id="message-error" class="error-message" role="alert" aria-live="polite"></div>
      </div>

      <button type="submit" class="submit-button">
        <span class="button-text">Send Message</span>
        <span class="button-spinner" aria-hidden="true"></span>
      </button>
    </form>
  </main>

  <div class="sidebar-overlay"></div>
