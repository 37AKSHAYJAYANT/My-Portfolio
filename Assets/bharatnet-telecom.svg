<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141e33" />
    </linearGradient>
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad4)" />

  <!-- Title Banner -->
  <rect x="50" y="30" width="700" height="46" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="70" y="58" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">🌐 BSNL BharatNet Telecom Infrastructure (200+ Nodes)</text>

  <!-- Left: Smart-Rack & HFCL Nodes -->
  <g transform="translate(60, 95)">
    <!-- Rack cabinet -->
    <rect width="250" height="380" rx="10" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <rect x="15" y="15" width="220" height="25" rx="4" fill="#1e293b" />
    <text x="30" y="32" fill="#f59e0b" font-family="monospace" font-weight="bold" font-size="11">Exicom EMS Smart-Rack</text>

    <!-- Slot 1: HFCL Router 1 -->
    <rect x="15" y="50" width="220" height="42" rx="4" fill="#1e293b" stroke="#334155" />
    <circle cx="35" cy="71" r="5" fill="#10b981" />
    <circle cx="50" cy="71" r="5" fill="#10b981" />
    <circle cx="65" cy="71" r="5" fill="#f59e0b" />
    <text x="85" y="75" fill="#f8fafc" font-family="monospace" font-size="10">HFCL Node #01 - Active</text>

    <!-- Slot 2: HFCL Router 2 -->
    <rect x="15" y="100" width="220" height="42" rx="4" fill="#1e293b" stroke="#334155" />
    <circle cx="35" cy="121" r="5" fill="#10b981" />
    <circle cx="50" cy="121" r="5" fill="#10b981" />
    <circle cx="65" cy="121" r="5" fill="#10b981" />
    <text x="85" y="125" fill="#f8fafc" font-family="monospace" font-size="10">HFCL Node #02 - Active</text>

    <!-- Slot 3: Switch / Patch Panel -->
    <rect x="15" y="150" width="220" height="42" rx="4" fill="#1e293b" stroke="#334155" />
    <g fill="#38bdf8">
      <rect x="30" y="165" width="8" height="12" rx="1" /><rect x="42" y="165" width="8" height="12" rx="1" />
      <rect x="54" y="165" width="8" height="12" rx="1" /><rect x="66" y="165" width="8" height="12" rx="1" />
      <rect x="78" y="165" width="8" height="12" rx="1" /><rect x="90" y="165" width="8" height="12" rx="1" />
    </g>
    <text x="110" y="175" fill="#94a3b8" font-family="monospace" font-size="9">Fiber Distribution</text>

    <!-- Slot 4: Power Distribution & Environmental Monitor -->
    <rect x="15" y="200" width="220" height="42" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="30" y="225" fill="#10b981" font-family="monospace" font-size="10">EMS Controller: 48V DC OK</text>

    <!-- Slot 5: Additional Nodes -->
    <rect x="15" y="250" width="220" height="55" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="30" y="275" fill="#38bdf8" font-family="monospace" font-size="10">High Availability Setup</text>
    <text x="30" y="292" fill="#94a3b8" font-family="monospace" font-size="9">BSNL Optical Fiber Backhaul</text>

    <!-- Slot 6: Bottom Vent -->
    <rect x="15" y="315" width="220" height="50" rx="4" fill="#0f172a" />
    <line x1="25" y1="330" x2="225" y2="330" stroke="#334155" stroke-width="2" />
    <line x1="25" y1="340" x2="225" y2="340" stroke="#334155" stroke-width="2" />
    <line x1="25" y1="350" x2="225" y2="350" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Right: Linux CLI & NMS / RFMS Dashboard -->
  <g transform="translate(340, 95)">
    <!-- Linux Terminal Window -->
    <rect width="410" height="190" rx="10" fill="#090d16" stroke="#22c55e" stroke-width="1.5" />
    <rect width="410" height="30" rx="10" fill="#1e293b" /><rect y="20" width="410" height="10" fill="#1e293b" />
    <circle cx="20" cy="15" r="5" fill="#ef4444" /><circle cx="35" cy="15" r="5" fill="#f59e0b" /><circle cx="50" cy="15" r="5" fill="#10b981" />
    <text x="75" y="19" fill="#94a3b8" font-family="monospace" font-size="10">bash: akshay@netzary-ops:~ (Linux Ubuntu)</text>
    
    <text x="18" y="55" fill="#22c55e" font-family="monospace" font-size="11">$ ssh admin@10.240.12.5 (HFCL Node 204)</text>
    <text x="18" y="75" fill="#94a3b8" font-family="monospace" font-size="11">System Uptime: 142 days, 16:42:10</text>
    <text x="18" y="95" fill="#22c55e" font-family="monospace" font-size="11">$ tail -f /var/log/nms/alarms.log | grep CRITICAL</text>
    <text x="18" y="115" fill="#38bdf8" font-family="monospace" font-size="11">[ALARM_CLEARED] BSNL Link Restored at Meerut-East</text>
    <text x="18" y="135" fill="#22c55e" font-family="monospace" font-size="11">$ ping -c 4 10.254.0.1</text>
    <text x="18" y="155" fill="#a3e635" font-family="monospace" font-size="11">4 packets transmitted, 4 received, 0% packet loss, 1.2ms</text>
    <text x="18" y="175" fill="#f59e0b" font-family="monospace" font-size="11">L1/L2 Diagnostic: Optimal status [OK]</text>

    <!-- NMS / RFMS Monitoring Panel -->
    <rect y="205" width="410" height="175" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect y="205" width="410" height="30" rx="10" fill="#1e293b" /><rect y="225" width="410" height="10" fill="#1e293b" />
    <text x="20" y="225" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11">📊 NMS &amp; RFMS National-Scale Health Monitor</text>

    <!-- Stats -->
    <rect x="15" y="250" width="115" height="55" rx="6" fill="#1e293b" />
    <text x="25" y="272" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="16">99.98%</text>
    <text x="25" y="292" fill="#94a3b8" font-family="sans-serif" font-size="10">Uptime SLA</text>

    <rect x="145" y="250" width="115" height="55" rx="6" fill="#1e293b" />
    <text x="155" y="272" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">200+ Nodes</text>
    <text x="155" y="292" fill="#94a3b8" font-family="sans-serif" font-size="10">Configured/Live</text>

    <rect x="275" y="250" width="120" height="55" rx="6" fill="#1e293b" />
    <text x="285" y="272" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="16">0 Critical</text>
    <text x="285" y="292" fill="#94a3b8" font-family="sans-serif" font-size="10">Pending Alarms</text>

    <text x="18" y="335" fill="#e2e8f0" font-family="sans-serif" font-size="11">Level 1 (L1) Troubleshooting &amp; Field Coordination</text>
    <text x="18" y="355" fill="#64748b" font-family="sans-serif" font-size="10">Live Production BharatNet Network Infrastructure</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="120" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="14" y="22" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12">HFCL Routers</text>

    <rect x="135" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="22" transform="translate(135,0)" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="12">Exicom EMS Rack</text>

    <rect x="290" y="0" width="125" height="34" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
    <text x="15" y="22" transform="translate(290,0)" fill="#22c55e" font-family="sans-serif" font-weight="bold" font-size="12">Linux (Ubuntu)</text>

    <rect x="430" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="15" y="22" transform="translate(430,0)" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12">NMS &amp; RFMS Tools</text>

    <rect x="580" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#F5A045" stroke-width="1.5" />
    <text x="14" y="22" transform="translate(580,0)" fill="#F5A045" font-family="sans-serif" font-weight="bold" font-size="12">L1 Troubleshooting</text>
  </g>
</svg>
